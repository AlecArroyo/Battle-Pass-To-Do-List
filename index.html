<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Pases de Vida · Edición Personal</title>

  <!-- Tipografía de imprenta clásica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Textura de papel envejecido -->
  <div class="paper-texture"></div>

  <header class="masthead">
    <div class="masthead-flag">
      <h1 class="masthead-title">Pases <span class="accent">de MIERDA</span></h1>
      <p class="masthead-tagline">Diario personal de hábitos, misiones y pequeñas victorias</p>
    </div>
    <div class="masthead-strip">
      <span class="masthead-date" id="datelineText">—</span>
      <span class="masthead-edition">Edición personal · Tomo I</span>
      <button class="btn btn--ghost" id="btnExport" title="Exportar tus datos a un archivo">Exportar datos</button>
    </div>
  </header>

  <div class="broadsheet-grid">
    <aside class="index-column">
      <div class="index-head">
        <span class="index-kicker">Secciones</span>
        <button class="btn btn--icon" id="btnNewPass" title="Abrir nueva sección">+</button>
      </div>
      <div class="index-list" id="railList"></div>
    </aside>

    <main class="front-page" id="hud"></main>
  </div>

  <!-- Ficha: crear/editar sección con niveles y premios -->
  <div class="sheet-overlay" id="modalPass" hidden>
    <form class="sheet sheet--lg" id="formPass">
      <div class="sheet-head">
        <h2 id="passModalTitle">Nueva sección</h2>
      </div>
      <label>Nombre de la sección
        <input type="text" name="name" required maxlength="40" placeholder="Ej. Gimnasio, Estudio, Música...">
      </label>
      <div class="row">
        <label>Símbolo
          <input type="text" name="icon" maxlength="4" placeholder="💪" value="⭐">
        </label>
        <label>Color de acento
          <input type="color" name="color" value="#7c2430">
        </label>
      </div>
      <label>Descripción
        <textarea name="description" maxlength="140" placeholder="¿De qué trata esta sección de tu vida?"></textarea>
      </label>

      <div class="row">
        <label>Estrellas por nivel
          <input type="number" name="starsPerLevel" min="1" max="50" value="10">
        </label>
        <label>Total de niveles
          <input type="number" id="inputMaxLevel" name="maxLevel" min="1" max="100" value="20">
        </label>
      </div>

      <!-- Editor de premios por nivel -->
      <fieldset class="prize-editor">
        <legend>Premios por nivel</legend>
        <p class="prize-editor-help">Asigna una recompensa para los niveles que quieras celebrar:</p>
        <div class="prize-editor-list" id="rewardsEditorList">
          <!-- Se genera según la cantidad de niveles -->
        </div>
      </fieldset>

      <div class="sheet-actions">
        <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn--primary" id="btnSubmitPass">Publicar sección</button>
      </div>
    </form>
  </div>

  <!-- Ficha: nueva misión -->
  <div class="sheet-overlay" id="modalMission" hidden>
    <form class="sheet" id="formMission">
      <div class="sheet-head">
        <h2>Nueva misión</h2>
      </div>
      <label>Título de la misión
        <input type="text" name="title" required maxlength="60" placeholder="Ej. Entrenar pierna 45 min">
      </label>
      <label>Detalles
        <textarea name="description" maxlength="140" placeholder="Notas sobre esta misión..."></textarea>
      </label>

      <!-- Selector de 6 colores pastel -->
      <label>Color de la tarjeta
        <div class="color-palette-selector">
          <label class="color-option" style="--c:#f6efdd" title="Crema Papiro">
            <input type="radio" name="color" value="#f6efdd" checked>
            <span class="color-swatch"></span>
          </label>
          <label class="color-option" style="--c:#f2dcd9" title="Rosa Pastel">
            <input type="radio" name="color" value="#f2dcd9">
            <span class="color-swatch"></span>
          </label>
          <label class="color-option" style="--c:#d8e2dc" title="Verde Salvia">
            <input type="radio" name="color" value="#d8e2dc">
            <span class="color-swatch"></span>
          </label>
          <label class="color-option" style="--c:#faedcb" title="Mostaza Suave">
            <input type="radio" name="color" value="#faedcb">
            <span class="color-swatch"></span>
          </label>
          <label class="color-option" style="--c:#d0e1fd" title="Azul Vintage">
            <input type="radio" name="color" value="#d0e1fd">
            <span class="color-swatch"></span>
          </label>
          <label class="color-option" style="--c:#e8dff5" title="Lavanda Tenue">
            <input type="radio" name="color" value="#e8dff5">
            <span class="color-swatch"></span>
          </label>
          <!-- Colores pastel adicionales -->

          <label class="color-option" style="--c:#f4b6a6" title="Salmón Pastel">
            <input type="radio" name="color" value="#f4b6a6">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#b8e0d2" title="Turquesa Menta">
            <input type="radio" name="color" value="#b8e0d2">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#a9cce3" title="Azul Cielo">
            <input type="radio" name="color" value="#a9cce3">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#c5d86d" title="Lima Pastel">
            <input type="radio" name="color" value="#c5d86d">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#f6c667" title="Amarillo Dorado">
            <input type="radio" name="color" value="#f6c667">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#f3a683" title="Melocotón">
            <input type="radio" name="color" value="#f3a683">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#b39ddb" title="Violeta Pastel">
            <input type="radio" name="color" value="#b39ddb">
            <span class="color-swatch"></span>
          </label>

          <label class="color-option" style="--c:#81c7c9" title="Aguamarina">
            <input type="radio" name="color" value="#81c7c9">
            <span class="color-swatch"></span>
          </label>
        </div>
      </label>

      <div class="row">
        <label>Casilla / Orden prioritario (1 - 6 o 0 sin asignar)
          <input type="number" name="orden" min="0" max="6" value="0" placeholder="0">
        </label>
        <label>Recompensa (estrellas ★)
          <input type="number" name="starsValue" min="1" max="10" value="1">
        </label>
      </div>

      <div class="row">
        <label>Fecha y hora de inicio
          <input type="datetime-local" name="startDate">
        </label>
        <label>Fecha y hora de finalización
          <input type="datetime-local" name="endDate">
        </label>
      </div>

      <fieldset class="choice-toggle">
        <legend>Tipo de misión</legend>
        <label class="choice">
          <input type="radio" name="metricType" value="boolean" checked>
          <span>Sencilla — se cumple de una vez</span>
        </label>
        <label class="choice">
          <input type="radio" name="metricType" value="counter">
          <span>Progresiva — avanza por conteo</span>
        </label>
      </fieldset>

      <div class="row counter-fields" hidden>
        <label>Unidad
          <input type="text" name="unit" placeholder="Ej. km, páginas">
        </label>
        <label>Meta
          <input type="number" name="targetValue" min="1" value="1">
        </label>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn--primary">Publicar misión</button>
      </div>
    </form>
  </div>

  <!-- Ficha rápida: asignar/editar premio de un nivel -->
  <div class="sheet-overlay" id="modalReward" hidden>
    <form class="sheet" id="formReward">
      <div class="sheet-head">
        <h2 id="rewardModalTitle">Asignar premio</h2>
      </div>
      <input type="hidden" name="level" id="rewardLevelInput">
      <label>Premio
        <input type="text" name="name" required maxlength="50" placeholder="Ej. Noche de pizza, Ir al cine...">
      </label>
      <label>Símbolo del premio
        <input type="text" name="icon" maxlength="4" placeholder="🎁" value="🎁">
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
        <button type="submit" class="btn btn--primary">Guardar premio</button>
      </div>
    </form>
  </div>

  <div class="bulletin-layer" id="toastLayer"></div>

  <script src="script.js"></script>
</body>

</html>
